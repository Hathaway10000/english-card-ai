<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学生端</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h2>📚 学生学习</h2>


<div id="taskList"></div>


<div id="content"></div>


</div>



<script>


let tasks = JSON.parse(
localStorage.getItem("tasks") || "[]"
);



let learned = JSON.parse(
localStorage.getItem("learned") || "{}"
);



const taskList =
document.getElementById("taskList");



tasks.forEach((task,index)=>{


let button=document.createElement("button");


button.innerHTML =
task.title || "学习任务"+(index+1);



button.onclick=function(){

showTask(index);

};



taskList.appendChild(button);


});






function showTask(index){


let task=tasks[index];


let html = `

<h3>
${task.title}
</h3>

<h4>
📖 学习中
</h4>

`;



let learnedWords =
learned[index] || [];



task.words.split("\n").forEach(line=>{


let data=line.trim().split(/\s+/);



if(data.length>=2){


let english=data[0];

let chinese=data[1];

let type=data[2] || "";



// 已经学会的不显示在这里

if(!learnedWords.includes(english)){


html += wordCard(
english,
chinese,
type,
index,
false
);


}



}


});



html += `

<hr>

<h4>
✅ 已会单词
</h4>

`;



if(learnedWords.length===0){

html += "<p>还没有已会单词</p>";

}


else{


learnedWords.forEach(word=>{


let line =
task.words.split("\n")
.find(x=>x.startsWith(word));


let data =
line.trim().split(/\s+/);



html += wordCard(
data[0],
data[1],
data[2]||"",
index,
true
);



});



}



document.getElementById("content").innerHTML =
html;



}








function wordCard(
english,
chinese,
type,
taskIndex,
isLearned
){


return `

<div class="card">


<div class="left">


<button onclick="speak('${english}')">
🔊
</button>


<span class="word">
${english}
</span>


</div>



<div class="right">


${chinese}

<br>


<small>
${type}
</small>


<br>


<button onclick="${
isLearned
?
`unlearn('${english}',${taskIndex})`
:
`learn('${english}',${taskIndex})`
}">


${isLearned ? "🔄重新学习":"✅已会"}


</button>


</div>


</div>


`;

}








function learn(word,index){


if(!learned[index]){

learned[index]=[];

}


if(!learned[index].includes(word)){


learned[index].push(word);


}



saveLearned();


showTask(index);


}






function unlearn(word,index){


learned[index]=
learned[index].filter(
x=>x!==word
);


saveLearned();


showTask(index);


}





function saveLearned(){


localStorage.setItem(
"learned",
JSON.stringify(learned)
);


}







function speak(word){


let speech =
new SpeechSynthesisUtterance(word);


speech.lang="en-US";


speech.rate=0.8;


speechSynthesis.speak(
speech
);


}



</script>


</body>

</html>
